
services:
  app:
    build: .
    ports:
      - "${MOVIES_SVC_PORT:-8000}:${MOVIES_SVC_PORT:-8000}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
     # Set environment variables for Postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: user
      POSTGRES_DB: password
      TZ: Asia/Kolkata         # ✅ Correct timezone (not Asia/Calcutta)
      PGTZ: Asia/Kolkata    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d movies_info"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: